name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 8 minutes
    - cron: '*/8 * * * *'
  workflow_dispatch: # allows manual trigger from the Actions tab for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://portfolio-tzvg.onrender.com/api/about